# Field Content Demo - App of Apps
# This chart deploys multiple components as separate ArgoCD Applications

# ============================================================
# GitOps Configuration
# ============================================================
gitops:
  # Repository containing the component charts (your fork or this template)
  repoUrl: "https://github.com/maximilianoPizarro/from-3scale-to-connectivity-link.git"
  revision: "main"
  basePath: "examples/helm"

# ArgoCD settings
argocd:
  namespace: openshift-gitops
  project: default

# ============================================================
# Connectivity Link (vendored from GitLab connectivity-link)
# One Argo CD Application per entry; paths under components/*
# ============================================================
connectivityLink:
  mcpToken: "IpIbd50gbMb1p2+iCigrhkm21pZwbn0g"
  argocdMcpToken: ""
  threescaleAccessToken: "placeholder-set-in-argocd"
  operators:
    channel: stable-4.20
    version: 4.20.4
    # servicemeshoperator3: templates/servicemeshoperator3.yaml (omit here to avoid duplicate)
    subscriptions:
      - name: cluster-observability-operator
        namespace: openshift-cluster-observability-operator
        channel: stable
        source: redhat-operators
      - name: grafana-operator
        namespace: openshift-operators
        channel: v5
        source: community-operators
      - name: kiali-ossm
        namespace: openshift-operators
        channel: stable
        source: redhat-operators

  # neuralbank-stack — Keycloak URLs derived from deployer.domain when synced
  neuralbank:
    global:
      postgresql:
        auth:
          postgresPassword: "supersecretpassword"
          username: "neuralbank"
          password: "neuralbank123!"
          database: "neuralbank"
    backend:
      image:
        repository: quay.io/maximilianopizarro/neuralbank-backend
        tag: "latest"
        pullPolicy: Always
      service:
        port: 8080
      replicaCount: 1
    frontend:
      image:
        repository: quay.io/maximilianopizarro/neuralbank-front
        tag: "pkce"
        pullPolicy: Always
      service:
        port: 8080
      replicaCount: 1
    keycloak:
      clientId: "neuralbank-frontend"
      clientSecret: ""
      issuerUrl: ""
      authorizationEndpoint: ""
      redirectUri: ""
      tokenEndpoint: ""
      postLogoutRedirectUri: ""
    api:
      baseUrl: "/api"

  # Argo CD Applications (order via sync-wave on Application metadata)
  apps:
    - id: connectivity-link-namespaces
      enabled: true
      path: namespaces
      destinationNamespace: openshift-gitops
      syncWave: "1"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: false
    - id: connectivity-link-openshift-gitops
      enabled: true
      path: openshift-gitops
      destinationNamespace: openshift-gitops
      syncWave: "0"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: connectivity-link-operators
      enabled: true
      path: operators
      destinationNamespace: openshift-operators
      syncWave: "2"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: openshift-virtualization
      enabled: true
      path: openshift-virtualization
      destinationNamespace: openshift-cnv
      syncWave: "3"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: connectivity-link-servicemeshoperator3
      enabled: true
      path: servicemeshoperator3
      destinationNamespace: openshift-operators
      syncWave: "3"
      prune: false
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: connectivity-link-rhbk
      enabled: true
      path: rhbk
      destinationNamespace: rhbk-operator
      syncWave: "2"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: connectivity-link-developer-hub
      enabled: true
      path: developer-hub
      destinationNamespace: developer-hub
      syncWave: "3"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: connectivity-link-rhcl-operator
      enabled: true
      path: rhcl-operator
      destinationNamespace: kuadrant-system
      syncWave: "6"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: connectivity-link-observability
      enabled: true
      path: observability
      destinationNamespace: openshift-cluster-observability-operator
      syncWave: "5"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: connectivity-link-kiali
      enabled: true
      path: kiali
      destinationNamespace: openshift-cluster-observability-operator
      syncWave: "6"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: connectivity-link-opentelemetry
      enabled: true
      path: opentelemetry
      destinationNamespace: openshift-opentelemetry
      syncWave: "6"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: connectivity-link-openshift-ai
      enabled: true
      path: openshift-ai
      destinationNamespace: openshift-ai
      syncWave: "6"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: connectivity-link-devspaces
      enabled: true
      path: devspaces
      destinationNamespace: devspaces
      syncWave: "7"
      prune: false
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: llm-serving
      enabled: true
      path: llm-serving
      destinationNamespace: openshift-ai-models
      syncWave: "7"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: connectivity-link-neuralbank-stack
      enabled: true
      path: neuralbank-stack
      destinationNamespace: neuralbank-stack
      syncWave: "5"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: ols
      enabled: true
      path: openshift-lightspeed
      destinationNamespace: openshift-lightspeed
      syncWave: "8"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: mcp-gateway
      enabled: true
      path: mcp-gateway
      destinationNamespace: mcp-system
      syncWave: "9"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: gitea
      enabled: true
      path: gitea
      destinationNamespace: gitea
      syncWave: "3"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: false
    - id: connectivity-link-applicationsets
      enabled: true
      path: applicationsets
      destinationNamespace: openshift-gitops
      syncWave: "4"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: connectivity-link-oauth-users
      enabled: true
      path: oauth-users
      destinationNamespace: openshift-config
      syncWave: "2"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: apishift-secrets
      enabled: true
      path: apishift-secrets
      destinationNamespace: gateforge
      syncWave: "8"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: connectivity-link-nfl-wallet
      enabled: true
      path: nfl-wallet
      destinationNamespace: nfl-wallet-prod
      syncWave: "7"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: 3scale-operator
      enabled: true
      path: 3scale-operator
      destinationNamespace: 3scale-system
      syncWave: "3"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: neuralbank-3scale
      enabled: true
      path: neuralbank-3scale
      destinationNamespace: neuralbank-3scale
      syncWave: "6"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: nfl-wallet-3scale
      enabled: true
      path: nfl-wallet-3scale
      destinationNamespace: nfl-wallet-3scale
      syncWave: "7"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: mock-apis-3scale
      enabled: true
      path: mock-apis-3scale
      destinationNamespace: mock-apis-3scale
      syncWave: "8"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    # Sample Gateways/HTTPRoutes/APIProducts for Kuadrant Console demos (mock-apis backends)
    - id: kuadrant-console-demo
      enabled: true
      path: kuadrant-console-demo
      destinationNamespace: kuadrant-console-demo
      syncWave: "9"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: microcks
      enabled: true
      path: microcks
      destinationNamespace: microcks
      syncWave: "8"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
      # Depends on helmApps.microcks-operator (syncWave 7) CRDs + controller
    - id: enterprise-apis-3scale
      enabled: true
      path: enterprise-apis-3scale
      destinationNamespace: user1-neuralbank
      syncWave: "9"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: apicast-scenarios
      enabled: true
      path: apicast-scenarios
      destinationNamespace: apicast-scenario-1
      syncWave: "9"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: true
    - id: workshop-registration
      enabled: true
      path: workshop-registration
      destinationNamespace: showroom
      syncWave: "10"
      prune: true
      selfHeal: true
      skipDryRunOnMissingResource: false

# ============================================================
# Helm Chart Applications (deployed via ArgoCD Helm source)
# These install third-party charts from external Helm repos
# ============================================================
  helmApps:
    - id: gitea
      enabled: true
      repoURL: "https://dl.gitea.com/charts/"
      chart: gitea
      targetRevision: "12.5.0"
      destinationNamespace: gitea
      syncWave: "3"
      values:
        global:
          compatibility:
            openshift:
              adaptSecurityContext: force
        gitea:
          admin:
            username: gitea_admin
            password: openshift
            email: admin@gitea.local
        postgresql-ha:
          enabled: false
        postgresql:
          enabled: true
        redis-cluster:
          enabled: false
        redis:
          enabled: true
        persistence:
          enabled: true
          size: 10Gi
        service:
          http:
            type: ClusterIP
            port: 3000
    - id: openshift-mcp-server
      enabled: true
      autoSync: false
      repoURL: "https://maximilianoPizarro.github.io/openshift-mcp-server"
      chart: openshift-mcp-server
      targetRevision: "0.1.0-alpha"
      destinationNamespace: openshift-lightspeed
      syncWave: "8"
      values:
        namespace: openshift-lightspeed
        litellm:
          model:
            name: "{{ .Values.litemaas.model | default .Values.maas.model }}"
            modelId: "{{ .Values.litemaas.model | default .Values.maas.model }}"
            apiBase: "{{ .Values.litemaas.apiUrl | default .Values.maas.endpoint }}"
            apiKey: "{{ .Values.litemaas.apiKey | default .Values.maas.apiKey }}"
    # Quarkus Microcks Operator (Ansible OLM operator is broken on clusters with
    # OpenShift Virtualization — python openshift client API discovery crash).
    - id: microcks-operator
      enabled: true
      repoURL: "https://github.com/microcks/microcks-operator"
      path: deploy/helm/microcks-operator
      targetRevision: "0.0.10"
      destinationNamespace: microcks
      syncWave: "7"
      values:
        image:
          repository: quay.io/microcks/microcks-operator
          tag: "0.0.10"
          pullPolicy: IfNotPresent
    - id: n8n
      enabled: true
      repoURL: "https://maximilianopizarro.github.io/n8n-helm-chart/"
      chart: n8n
      targetRevision: "1.16.0"
      destinationNamespace: openshift-lightspeed
      syncWave: "8"
      values:
        mailpit:
          enabled: true
          route:
            enabled: true
    # Chart on main: helm/apishift. Images retagged to maximilianopizarro/gateforge-*
    # (upstream CI publishes everythingascode/apishift-*; frontend there is private).
    - id: apishift
      enabled: true
      # Keep autoSync on so fresh clusters get GateForge without a manual Argo sync
      # (previously false left field-content-helm-apishift Missing / empty gateforge).
      autoSync: true
      repoURL: "https://github.com/Everything-is-Code/apishift"
      path: helm/apishift
      targetRevision: "main"
      destinationNamespace: gateforge
      syncWave: "9"
      values:
        clusterDomain: "{{ .Values.deployer.domain }}"
        route:
          enabled: true
          host: "gateforge-gateforge.{{ .Values.deployer.domain }}"
        backend:
          image:
            repository: quay.io/maximilianopizarro/gateforge-backend
            tag: latest
            pullPolicy: Always
        frontend:
          image:
            repository: quay.io/maximilianopizarro/gateforge-frontend
            tag: latest
            pullPolicy: Always
        ai:
          enabled: true
          endpoint: "{{ .Values.litemaas.apiUrl | default .Values.maas.endpoint }}"
          model: "{{ .Values.litemaas.model | default .Values.maas.model }}"
          apiKey: "{{ .Values.litemaas.apiKey | default .Values.maas.apiKey }}"
          existingSecret: gateforge-ai-secret
        threescale:
          adminApi:
            enabled: true
            url: "https://3scale-admin.{{ .Values.deployer.domain }}"
            accessToken: "placeholder-set-in-argocd"
          crdDiscovery:
            enabled: true
            namespace: 3scale-system
        connectivityLink:
          targetNamespace: kuadrant-system
          gatewayStrategy: shared
          gatewayClassName: istio
        postgresql:
          enabled: true
          username: gateforge
          password: gateforge
        datagrid:
          enabled: true
          image:
            repository: quay.io/infinispan/server
            tag: "15.0"
          replicas: 1
          credentials:
            username: developer
            password: changeme
        developerHub:
          enabled: true
          url: "https://backstage-developer-hub-developer-hub.{{ .Values.deployer.domain }}"
          scaffolderUrl: "https://backstage-developer-hub-developer-hub.{{ .Values.deployer.domain }}/api/scaffolder/v2/tasks"
          scaffolderToken: "placeholder-set-in-argocd"
          componentSuffix: "-product"
    # Mushino migration GUI — chart on maximilianoPizarro fork (evolutivo → nmushino/migration-toolkit-rhcl).
    - id: migration-toolkit-rhcl
      enabled: true
      repoURL: "https://github.com/maximilianoPizarro/migration-toolkit-rhcl"
      path: helm/migration-toolkit-rhcl
      targetRevision: "main"
      destinationNamespace: migration-toolkit
      syncWave: "9"
      values:
        route:
          enabled: true
          host: "migration-toolkit.{{ .Values.deployer.domain }}"
          timeout: "5m"
        backend:
          image:
            repository: quay.io/maximilianopizarro/migration-toolkit-rhcl-backend
            tag: v0.1.0
            pullPolicy: Always
        frontend:
          image:
            repository: quay.io/maximilianopizarro/migration-toolkit-rhcl-frontend
            tag: v0.1.0
            pullPolicy: Always
        postgresql:
          enabled: true
    # Kuadrant / Connectivity Link OpenShift Console plugin
    # Docs: https://maximilianopizarro.github.io/custom-rhcl-console/
    # Namespace MUST be custom-rhcl-console (plugin hardcodes ConfigMap lookups there).
    - id: custom-rhcl-console
      enabled: true
      repoURL: "https://github.com/maximilianoPizarro/custom-rhcl-console"
      path: helm/custom-rhcl-console
      targetRevision: "main"
      destinationNamespace: custom-rhcl-console
      syncWave: "10"
      values:
        # Chart default is false; enable so the Namespace manifest exists before
        # namespaced resources (Argo CreateNamespace alone raced ConsolePlugin sync).
        createNamespace: true
        image:
          repository: quay.io/maximilianopizarro/custom-rhcl-console
          tag: v0.1.1
          pullPolicy: Always
        consolePlugin:
          name: custom-rhcl-console
          displayName: "Connectivity Link"
          patchConsole: true
        config:
          create: true
          name: custom-rhcl-console-config
          grafanaNamespace: openshift-cluster-observability-operator
          grafanaRouteName: grafana-observability-route
          tempoNamespace: openshift-tempo
          tempoGatewayRouteName: tempo-connectivity-link-jaegerui
          tempoStackName: connectivity-link
          developerHubUrl: "https://backstage-developer-hub-developer-hub.{{ .Values.deployer.domain }}"
        dnsProber:
          enabled: true
          image:
            repository: quay.io/maximilianopizarro/custom-rhcl-console
            tag: dns-prober-v0.1.1
            pullPolicy: Always
          route:
            enabled: true
            host: "dns-prober-custom-rhcl-console.{{ .Values.deployer.domain }}"

# ============================================================
# LiteMaaS / MaaS — single LLM source (RHDP injects apiKey; never commit real keys)
# Consumers: OLS, Developer Hub Lightspeed, openshift-mcp-server, ApiShift
# ============================================================
litemaas:
  enabled: true
  # apiKey injected by RHDP / Argo valuesObject — never commit real keys
  apiKey: ""
  apiUrl: "https://maas-rhdp.apps.maas.redhatworkshops.io/v1"
  model: "qwen3-14b"

# Legacy aliases — prefer litemaas.*; kept as fallbacks for older overlays
maas:
  apiKey: ""
  endpoint: "https://maas-rhdp.apps.maas.redhatworkshops.io/v1"
  model: "qwen3-14b"

# Lightspeed OLS — derived from litemaas when present (see connectivity-link-applications.yaml)
lightspeed:
  llmApiKey: ""
  llmEndpoint: "https://maas-rhdp.apps.maas.redhatworkshops.io/v1"

# ============================================================
# User Scaling — single parameter controls all user provisioning
# Keycloak users, DevSpaces namespaces, RBAC policy, workshop registration
# Recommended: 30 (small), 50 (medium), 100 (large), 200 (extra-large)
# See README.md "Cluster Sizing" for node/resource recommendations
# ============================================================
userCount: 200

# ============================================================
# Workshop Registration Portal
# ============================================================
workshopRegistration:
  adminToken: "workshop-admin-2024"
  keycloakAdminPassword: ""

# ============================================================
# Components - Enable/disable and configure each component
# ============================================================
components:

  # --- Hello World Demo Application ---
  helloWorld:
    enabled: false
    namespace: terminal-demo
    appName: hello-world
    replicas: 1
    image: registry.redhat.io/ubi8/httpd-24:latest
    userInfo:
      enabled: true
      title: "Web Terminal Demo"
      instructions: "Access the Showroom lab guide, then click the terminal icon (>_) in the OpenShift console."

  # --- Showroom Lab Guide ---
  showroom:
    enabled: true
    namespace: showroom
    name: showroom
    content:
      repoUrl: "https://github.com/maximilianoPizarro/from-3scale-to-connectivity-link.git"
      repoRef: "main"
      antoraPlaybook: "showroom/site.yml"
      image: "quay.io/rhpds/showroom-content:v1.3.1"
    nookbag:
      enabled: true
      bundleUrl: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.2.1/nookbag-v0.2.1.zip"
    terminal:
      enabled: true
      image: "quay.io/rhpds/openshift-showroom-terminal-ocp:latest"
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"

# ============================================================
# Values injected by field content workload (do not modify)
# ============================================================
deployer:
  domain: "apps.cluster-lfm7v.dynamic2.redhatworkshops.io"
  apiUrl: ""

fieldContent:
  deploymentType: "helm"
