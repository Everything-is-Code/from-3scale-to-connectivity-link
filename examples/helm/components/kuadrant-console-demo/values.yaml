clusterDomain: apps.cluster.example.com

# Mock backends live in mock-apis-3scale (ExternalName services bridge them here)
mockNamespace: mock-apis-3scale

# Public pathPrefix is unique per product; URLRewrite maps it to backendPath
# (neuralbank-backend currently exposes /api/v1/customers on every mock pod).
apis:
  - name: inventory-service
    displayName: Inventory Service API
    description: Real-time stock levels, warehouse locations, and reorder triggers. Backed by the workshop mock service.
    pathPrefix: /inventory
    backendPath: /api/v1/customers
    auth: apikey
    tags: [inventory, apikey, demo]
  - name: payment-gateway
    displayName: Payment Gateway API
    description: Card transactions, refunds, and settlement reports for the demo catalog.
    pathPrefix: /payments
    backendPath: /api/v1/customers
    auth: apikey
    tags: [payments, apikey, demo, fintech]
  - name: order-management
    displayName: Order Management API
    description: Order lifecycle from creation through fulfillment and returns.
    pathPrefix: /orders
    backendPath: /api/v1/customers
    auth: apikey
    tags: [orders, apikey, demo]
  - name: customer-loyalty
    displayName: Customer Loyalty API
    description: Points balance, tier status, and reward redemption.
    pathPrefix: /loyalty
    backendPath: /api/v1/customers
    auth: apikey
    tags: [loyalty, apikey, demo]
  - name: shipping-tracker
    displayName: Shipping Tracker API
    description: Shipment status and delivery ETA for demo logistics flows.
    pathPrefix: /shipping
    backendPath: /api/v1/customers
    auth: apikey
    tags: [shipping, apikey, demo]
  - name: notification-hub
    displayName: Notification Hub API
    description: Email/SMS/push notification fan-out for workshop demos.
    pathPrefix: /notifications
    backendPath: /api/v1/customers
    auth: apikey
    tags: [notifications, apikey, demo]
