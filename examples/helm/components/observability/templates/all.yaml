apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  name: api-gateway-metrics
  namespace: openshift-cluster-observability-operator
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-observability
  json: |
    {
      "annotations": { "list": [] },
      "title": "API Gateway Metrics",
      "uid": "api-gateway-metrics",
      "version": 1,
      "panels": [
        {
          "title": "Request Rate by Gateway",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total[5m])) by (destination_workload_namespace)",
              "legendFormat": "{{`{{destination_workload_namespace}}`}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Error Rate (4xx/5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{response_code=~\"[45].*\"}[5m])) by (destination_workload_namespace)",
              "legendFormat": "{{`{{destination_workload_namespace}}`}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "P95 Latency (ms)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket[5m])) by (le, destination_workload_namespace))",
              "legendFormat": "{{`{{destination_workload_namespace}}`}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Rate Limit Rejections",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{response_code=\"429\"}[5m]))",
              "legendFormat": "429 Too Many Requests"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        }
      ],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus (RHOBS)", "value": "Prometheus (RHOBS)" }
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "schemaVersion": 39
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  name: service-mesh-overview
  namespace: openshift-cluster-observability-operator
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-observability
  json: |
    {
      "annotations": { "list": [] },
      "title": "Service Mesh Overview",
      "uid": "service-mesh-overview",
      "version": 3,
      "panels": [
        {
          "title": "Total Requests/s",
          "type": "gauge",
          "gridPos": { "h": 7, "w": 6, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps", "min": 0, "max": 100,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "super-light-green", "value": null },
                { "color": "green", "value": 1 },
                { "color": "orange", "value": 50 },
                { "color": "red", "value": 80 }
              ]}
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "showThresholdLabels": false, "showThresholdMarkers": true },
          "targets": [{ "expr": "sum(rate(istio_requests_total[5m]))", "instant": true }],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Success Rate",
          "type": "gauge",
          "gridPos": { "h": 7, "w": 6, "x": 6, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "min": 0, "max": 1,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "red", "value": null },
                { "color": "orange", "value": 0.90 },
                { "color": "yellow", "value": 0.95 },
                { "color": "green", "value": 0.99 }
              ]}
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "showThresholdLabels": false, "showThresholdMarkers": true },
          "targets": [{ "expr": "sum(rate(istio_requests_total{response_code=~\"2..\"}[5m])) / sum(rate(istio_requests_total[5m]))", "instant": true }],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "P95 Latency",
          "type": "gauge",
          "gridPos": { "h": 7, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "ms", "min": 0, "max": 2000,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 100 },
                { "color": "orange", "value": 500 },
                { "color": "red", "value": 1000 }
              ]}
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "showThresholdLabels": false, "showThresholdMarkers": true },
          "targets": [{ "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket[5m])) by (le))", "instant": true }],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Error Rate",
          "type": "gauge",
          "gridPos": { "h": 7, "w": 6, "x": 18, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit", "min": 0, "max": 0.5,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 0.01 },
                { "color": "orange", "value": 0.05 },
                { "color": "red", "value": 0.10 }
              ]}
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "showThresholdLabels": false, "showThresholdMarkers": true },
          "targets": [{ "expr": "sum(rate(istio_requests_total{response_code=~\"[45]..\"}[5m])) / sum(rate(istio_requests_total[5m]))", "instant": true }],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "2xx Responses",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "targets": [{ "expr": "sum(rate(istio_requests_total{response_code=~\"2..\"}[5m]))", "instant": true }],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "4xx Errors",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 0.1 }, { "color": "red", "value": 1 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "targets": [{ "expr": "sum(rate(istio_requests_total{response_code=~\"4..\"}[5m]))", "instant": true }],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "5xx Errors",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 7 },
          "fieldConfig": { "defaults": { "unit": "reqps", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 0.01 }, { "color": "red", "value": 0.1 }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "targets": [{ "expr": "sum(rate(istio_requests_total{response_code=~\"5..\"}[5m]))", "instant": true }],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "TCP Sent",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 7 },
          "fieldConfig": { "defaults": { "unit": "Bps", "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "targets": [{ "expr": "sum(rate(istio_tcp_sent_bytes_total[5m]))", "instant": true }],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "TCP Received",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 7 },
          "fieldConfig": { "defaults": { "unit": "Bps", "thresholds": { "mode": "absolute", "steps": [{ "color": "purple", "value": null }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "targets": [{ "expr": "sum(rate(istio_tcp_received_bytes_total[5m]))", "instant": true }],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Connections/s",
          "type": "stat",
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 7 },
          "fieldConfig": { "defaults": { "unit": "cps", "thresholds": { "mode": "absolute", "steps": [{ "color": "yellow", "value": null }] } } },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "colorMode": "background", "graphMode": "area" },
          "targets": [{ "expr": "sum(rate(istio_tcp_connections_opened_total[5m]))", "instant": true }],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Traffic Flow — Request Rate (source → destination)",
          "description": "L7 HTTP request rate from gateways and waypoint proxies",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 11 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "fillOpacity": 15, "lineWidth": 2, "showPoints": "never" }
            }
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\"}[5m])) by (source_workload, source_workload_namespace, destination_workload, destination_workload_namespace)",
              "legendFormat": "{{`{{source_workload_namespace}}`}}/{{`{{source_workload}}`}} → {{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Request Rate by Namespace",
          "description": "Total request rate per destination namespace (L7 + L4 combined view)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 19 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "fillOpacity": 15, "lineWidth": 2, "showPoints": "never" }
            }
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\"}[5m])) by (destination_workload_namespace)",
              "legendFormat": "{{`{{destination_workload_namespace}}`}} (L7)"
            },
            {
              "expr": "sum(rate(istio_tcp_connections_opened_total{reporter=\"destination\"}[5m])) by (destination_workload_namespace)",
              "legendFormat": "{{`{{destination_workload_namespace}}`}} (TCP conn/s)"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Success Rate (2xx %)",
          "description": "Percentage of successful (2xx) responses per destination service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 27 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 0.95 },
                  { "color": "green", "value": 0.99 }
                ]
              }
            }
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{response_code=~\"2.*\", reporter=\"destination\"}[5m])) by (destination_workload, destination_workload_namespace) / sum(rate(istio_requests_total{reporter=\"destination\"}[5m])) by (destination_workload, destination_workload_namespace)",
              "legendFormat": "{{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Success Rate — Current",
          "description": "Instant success rate gauge per destination service",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 27 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 0.95 },
                  { "color": "green", "value": 0.99 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{response_code=~\"2.*\", reporter=\"destination\"}[5m])) by (destination_workload, destination_workload_namespace) / sum(rate(istio_requests_total{reporter=\"destination\"}[5m])) by (destination_workload, destination_workload_namespace)",
              "legendFormat": "{{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}",
              "instant": true
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Latency P50 / P95 / P99",
          "description": "Request latency percentiles by destination service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 35 },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "fillOpacity": 8, "lineWidth": 2, "showPoints": "never" }
            }
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\"}[5m])) by (le, destination_workload, destination_workload_namespace))",
              "legendFormat": "P50 — {{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\"}[5m])) by (le, destination_workload, destination_workload_namespace))",
              "legendFormat": "P95 — {{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\"}[5m])) by (le, destination_workload, destination_workload_namespace))",
              "legendFormat": "P99 — {{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "P95 Latency per Service",
          "description": "Current P95 latency gauge per destination service",
          "type": "gauge",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 35 },
          "fieldConfig": {
            "defaults": {
              "unit": "ms", "min": 0, "max": 2000,
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "yellow", "value": 100 },
                { "color": "orange", "value": 500 },
                { "color": "red", "value": 1000 }
              ]}
            }
          },
          "options": { "reduceOptions": { "calcs": ["lastNotNull"] }, "showThresholdLabels": false, "showThresholdMarkers": true },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\"}[5m])) by (le, destination_workload, destination_workload_namespace))",
              "legendFormat": "{{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}",
              "instant": true
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "TCP Traffic — Bytes Sent",
          "description": "TCP bytes sent rate from ztunnel L4 telemetry",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 43 },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never", "drawStyle": "bars" }
            }
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum(rate(istio_tcp_sent_bytes_total{reporter=\"destination\"}[5m])) by (destination_workload, destination_workload_namespace)",
              "legendFormat": "{{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "TCP Traffic — Bytes Received",
          "description": "TCP bytes received rate from ztunnel L4 telemetry",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 43 },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps",
              "custom": { "fillOpacity": 20, "lineWidth": 2, "showPoints": "never", "drawStyle": "bars" }
            }
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum(rate(istio_tcp_received_bytes_total{reporter=\"destination\"}[5m])) by (destination_workload, destination_workload_namespace)",
              "legendFormat": "{{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Active Connections (opened − closed rate)",
          "description": "Net connection rate per destination from ztunnel",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 51 },
          "fieldConfig": {
            "defaults": {
              "unit": "cps",
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" }
            }
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum(rate(istio_tcp_connections_opened_total{reporter=\"destination\"}[5m])) by (destination_workload, destination_workload_namespace)",
              "legendFormat": "opened — {{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}"
            },
            {
              "expr": "sum(rate(istio_tcp_connections_closed_total{reporter=\"destination\"}[5m])) by (destination_workload, destination_workload_namespace)",
              "legendFormat": "closed — {{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "TCP Connections Opened Rate",
          "description": "Rate of new TCP connections per destination",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 51 },
          "fieldConfig": {
            "defaults": {
              "unit": "cps",
              "custom": { "fillOpacity": 10, "lineWidth": 2, "showPoints": "never" }
            }
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum(rate(istio_tcp_connections_opened_total{reporter=\"destination\"}[5m])) by (destination_workload, destination_workload_namespace)",
              "legendFormat": "{{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Waypoint — Request Rate (L7 via waypoint)",
          "description": "L7 traffic handled by ambient mesh waypoint proxies",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 59 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "fillOpacity": 15, "lineWidth": 2, "showPoints": "never" }
            }
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"waypoint\"}[5m])) by (destination_workload, destination_workload_namespace)",
              "legendFormat": "[waypoint] {{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}"
            },
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\", source_workload=~\".*waypoint.*\"}[5m])) by (destination_workload, destination_workload_namespace)",
              "legendFormat": "[via-wp] {{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}"
            },
            {
              "expr": "sum(rate(istio_requests_total{reporter=\"destination\", destination_workload=~\".*waypoint.*\"}[5m])) by (source_workload, source_workload_namespace)",
              "legendFormat": "[to-wp] {{`{{source_workload_namespace}}`}}/{{`{{source_workload}}`}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Waypoint — Latency P95",
          "description": "P95 latency for traffic processed by waypoint proxies",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 59 },
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": { "fillOpacity": 8, "lineWidth": 2, "showPoints": "never" }
            }
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"waypoint\"}[5m])) by (le, destination_workload, destination_workload_namespace))",
              "legendFormat": "[waypoint] P95 — {{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{reporter=\"destination\", source_workload=~\".*waypoint.*\"}[5m])) by (le, destination_workload, destination_workload_namespace))",
              "legendFormat": "[via-wp] P95 — {{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Error Breakdown — 4xx by Destination",
          "description": "Client error rate (4xx) per destination service and response code",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 67 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "fillOpacity": 15, "lineWidth": 2, "showPoints": "never", "stacking": { "mode": "normal" } }
            }
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{response_code=~\"4.*\", reporter=\"destination\"}[5m])) by (destination_workload, destination_workload_namespace, response_code)",
              "legendFormat": "{{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}} [{{`{{response_code}}`}}]"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Error Breakdown — 5xx by Destination",
          "description": "Server error rate (5xx) per destination service and response code",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 67 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": { "fillOpacity": 15, "lineWidth": 2, "showPoints": "never", "stacking": { "mode": "normal" } }
            }
          },
          "options": { "tooltip": { "mode": "multi" } },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{response_code=~\"5.*\", reporter=\"destination\"}[5m])) by (destination_workload, destination_workload_namespace, response_code)",
              "legendFormat": "{{`{{destination_workload_namespace}}`}}/{{`{{destination_workload}}`}} [{{`{{response_code}}`}}]"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        }
      ],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus (RHOBS)", "value": "Prometheus (RHOBS)" }
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39
    }
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "6"
  name: kuadrant-policy-metrics
  namespace: openshift-cluster-observability-operator
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana-observability
  json: |
    {
      "annotations": { "list": [] },
      "title": "Kuadrant Policy Metrics",
      "uid": "kuadrant-policy-metrics",
      "version": 1,
      "panels": [
        {
          "title": "Auth Decisions (2xx vs 401 vs 403)",
          "description": "Authenticated vs rejected requests across all Kuadrant-protected routes",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "fillOpacity": 10, "lineWidth": 2 } }
          },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{response_code=~\"2..\", destination_workload_namespace=~\"kuadrant-console-demo|neuralbank-stack|nfl-wallet-prod\"}[5m])) by (destination_workload_namespace)",
              "legendFormat": "{{`{{destination_workload_namespace}}`}} 2xx"
            },
            {
              "expr": "sum(rate(istio_requests_total{response_code=\"401\", destination_workload_namespace=~\"kuadrant-console-demo|neuralbank-stack|nfl-wallet-prod\"}[5m])) by (destination_workload_namespace)",
              "legendFormat": "{{`{{destination_workload_namespace}}`}} 401"
            },
            {
              "expr": "sum(rate(istio_requests_total{response_code=\"403\", destination_workload_namespace=~\"kuadrant-console-demo|neuralbank-stack|nfl-wallet-prod\"}[5m])) by (destination_workload_namespace)",
              "legendFormat": "{{`{{destination_workload_namespace}}`}} 403"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Rate Limit Rejections (429)",
          "description": "Requests rejected by Kuadrant RateLimitPolicy / PlanPolicy per namespace",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "fillOpacity": 15, "lineWidth": 2, "drawStyle": "bars" } }
          },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{response_code=\"429\", destination_workload_namespace=~\"kuadrant-console-demo|neuralbank-stack|nfl-wallet-prod\"}[5m])) by (destination_workload_namespace)",
              "legendFormat": "{{`{{destination_workload_namespace}}`}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Request Rate by API Route",
          "description": "Per-route traffic through Kuadrant-protected gateways",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "fillOpacity": 5, "lineWidth": 1 } }
          },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{destination_workload_namespace=\"kuadrant-console-demo\"}[5m])) by (destination_workload, response_code)",
              "legendFormat": "{{`{{destination_workload}}`}} [{{`{{response_code}}`}}]"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "P95 Latency by Route",
          "description": "95th percentile latency for Kuadrant demo routes",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": { "unit": "ms", "custom": { "fillOpacity": 5 } }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(istio_request_duration_milliseconds_bucket{destination_workload_namespace=\"kuadrant-console-demo\"}[5m])) by (le, destination_workload))",
              "legendFormat": "{{`{{destination_workload}}`}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Auth + Rate Limit Status Overview",
          "description": "Current state of all Kuadrant-protected namespaces",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 0.01 },
                { "color": "red", "value": 0.05 }
              ]}
            }
          },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{response_code=~\"4..\", destination_workload_namespace=~\"kuadrant-console-demo|neuralbank-stack|nfl-wallet-prod\"}[5m])) / sum(rate(istio_requests_total{destination_workload_namespace=~\"kuadrant-console-demo|neuralbank-stack|nfl-wallet-prod\"}[5m]))",
              "legendFormat": "Error Ratio (4xx)"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        },
        {
          "title": "Requests by Response Code (All Kuadrant Namespaces)",
          "description": "Stacked breakdown of all response codes across Kuadrant-protected services",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "custom": { "fillOpacity": 30, "lineWidth": 1, "stacking": { "mode": "normal" } } }
          },
          "targets": [
            {
              "expr": "sum(rate(istio_requests_total{destination_workload_namespace=~\"kuadrant-console-demo|neuralbank-stack|nfl-wallet-prod\"}[5m])) by (response_code)",
              "legendFormat": "{{`{{response_code}}`}}"
            }
          ],
          "datasource": { "type": "prometheus", "uid": "${DS_PROMETHEUS}" }
        }
      ],
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "Prometheus (RHOBS)", "value": "Prometheus (RHOBS)" }
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "schemaVersion": 39
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  name: mesh-traffic-generator
  namespace: openshift-cluster-observability-operator
data:
  generate.sh: |
    #!/bin/sh
    DOMAIN="{{ .Values.clusterDomain | default "apps.cluster.example.com" }}"
    NB_HOST="neuralbank.${DOMAIN}"
    NFL_HOST="nfl-wallet.${DOMAIN}"
    LM_HOST="litemaas.${DOMAIN}"
    DEMO_HOST="kuadrant-demo.${DOMAIN}"
    NFL_KEY="nfl-wallet-demo-key-2024"

    echo "=== Mesh Traffic Generator ==="
    echo "Interval: ${INTERVAL:-5}s"

    while true; do
      TS=$(date '+%H:%M:%S')
      # Neuralbank via gateway (OIDC 302, L7 waypoint metrics)
      curl -sk -o /dev/null -w "${TS} %{http_code} nb-gw/q/health\n" --connect-timeout 2 --max-time 4 \
        -H "Host: $NB_HOST" "http://neuralbank-gateway-istio.neuralbank-stack.svc:8080/q/health" &
      curl -sk -o /dev/null -w "${TS} %{http_code} nb-gw/api/v1/customers\n" --connect-timeout 2 --max-time 4 \
        -H "Host: $NB_HOST" "http://neuralbank-gateway-istio.neuralbank-stack.svc:8080/api/v1/customers" &
      # Neuralbank direct backend (200, L4 ztunnel metrics)
      curl -sk -o /dev/null -w "${TS} %{http_code} nb-svc/q/health\n" --connect-timeout 2 --max-time 4 \
        "http://neuralbank-backend-svc.neuralbank-stack.svc:8080/q/health" &
      # NFL Wallet via gateway with API key (200, L7 waypoint metrics)
      curl -sk -o /dev/null -w "${TS} %{http_code} nfl-gw/api/v1/customers\n" --connect-timeout 2 --max-time 4 \
        -H "Host: $NFL_HOST" -H "X-API-Key: $NFL_KEY" \
        "http://nfl-wallet-gateway-istio.nfl-wallet-prod.svc:8080/api/v1/customers" &
      # NFL Wallet direct backend (200, L4 ztunnel metrics)
      curl -sk -o /dev/null -w "${TS} %{http_code} nfl-svc/q/health\n" --connect-timeout 2 --max-time 4 \
        "http://nfl-wallet-api.nfl-wallet-prod.svc:8080/q/health" &
      # LiteMaaS via gateway (200, L7 waypoint metrics)
      curl -sk -o /dev/null -w "${TS} %{http_code} lm-gw/\n" --connect-timeout 2 --max-time 4 \
        -H "Host: $LM_HOST" "http://litemaas-gateway-istio.litemaas.svc:8080/" &
      # Kuadrant Console demo APIs via gateway (API key auth, rate limiting)
      curl -sk -o /dev/null -w "${TS} %{http_code} demo/inventory\n" --connect-timeout 2 --max-time 4 \
        -H "Host: $DEMO_HOST" -H "X-API-Key: demo-inventory-service-key" \
        "http://demo-gateway-istio.kuadrant-console-demo.svc:80/inventory" &
      curl -sk -o /dev/null -w "${TS} %{http_code} demo/payments\n" --connect-timeout 2 --max-time 4 \
        -H "Host: $DEMO_HOST" -H "X-API-Key: demo-payment-gateway-key" \
        "http://demo-gateway-istio.kuadrant-console-demo.svc:80/payments" &
      curl -sk -o /dev/null -w "${TS} %{http_code} demo/orders\n" --connect-timeout 2 --max-time 4 \
        -H "Host: $DEMO_HOST" -H "X-API-Key: demo-order-management-key" \
        "http://demo-gateway-istio.kuadrant-console-demo.svc:80/orders" &
      curl -sk -o /dev/null -w "${TS} %{http_code} demo/loyalty\n" --connect-timeout 2 --max-time 4 \
        -H "Host: $DEMO_HOST" -H "X-API-Key: demo-customer-loyalty-key" \
        "http://demo-gateway-istio.kuadrant-console-demo.svc:80/loyalty" &
      curl -sk -o /dev/null -w "${TS} %{http_code} demo/shipping\n" --connect-timeout 2 --max-time 4 \
        -H "Host: $DEMO_HOST" -H "X-API-Key: demo-shipping-tracker-key" \
        "http://demo-gateway-istio.kuadrant-console-demo.svc:80/shipping" &
      curl -sk -o /dev/null -w "${TS} %{http_code} demo/notifications\n" --connect-timeout 2 --max-time 4 \
        -H "Host: $DEMO_HOST" -H "X-API-Key: demo-notification-hub-key" \
        "http://demo-gateway-istio.kuadrant-console-demo.svc:80/notifications" &
      # Kuadrant demo: unauthenticated hit to trigger 401 (auth metrics)
      curl -sk -o /dev/null -w "${TS} %{http_code} demo/inventory-nokey\n" --connect-timeout 2 --max-time 4 \
        -H "Host: $DEMO_HOST" "http://demo-gateway-istio.kuadrant-console-demo.svc:80/inventory" &
      # user1-neuralbank-backend via gateway (API Key auth)
      curl -sk -o /dev/null -w "${TS} %{http_code} u1-nb/api/customers\n" --connect-timeout 2 --max-time 4 \
        "http://neuralbank-backend-gateway-istio.user1-neuralbank.svc:8080/api/customers" &
      curl -sk -o /dev/null -w "${TS} %{http_code} u1-nb/api/credits\n" --connect-timeout 2 --max-time 4 \
        "http://neuralbank-backend-gateway-istio.user1-neuralbank.svc:8080/api/credits" &
      # user1-customer-service-mcp via gateway
      curl -sk -o /dev/null -w "${TS} %{http_code} u1-mcp/mcp\n" --connect-timeout 2 --max-time 4 \
        -X POST -d '{}' "http://customer-service-mcp-gateway-istio.user1-neuralbank.svc:8080/mcp" &
      wait
      sleep $(( ${INTERVAL:-5} + RANDOM % 3 ))
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  labels:
    app: mesh-traffic-generator
    app.kubernetes.io/part-of: observability
  name: mesh-traffic-generator
  namespace: openshift-cluster-observability-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mesh-traffic-generator
  template:
    metadata:
      labels:
        app: mesh-traffic-generator
    spec:
      containers:
      - name: traffic-gen
        image: registry.access.redhat.com/ubi9/ubi:latest
        command: ["/bin/sh", "/scripts/generate.sh"]
        env:
        - name: INTERVAL
          value: "5"
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
      volumes:
      - name: scripts
        configMap:
          name: mesh-traffic-generator
          defaultMode: 0755
      terminationGracePeriodSeconds: 5
